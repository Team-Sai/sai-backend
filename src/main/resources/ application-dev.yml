spring:
  application:
    name: sai-backend

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3307/sai_backend
    username: shinhanuser
    password: 1234

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.teamsai.saiwonjang.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: null

mock-bank:
  base-url: http://localhost:8081

logging:
  level:
    com.teamsai.saiwonjang: debug