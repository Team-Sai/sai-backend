<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>본인인증 테스트</title>

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <th:block
            th:replace="~{fragments/app-shell :: commonStyles}">
    </th:block>
    <link rel="stylesheet"
          href="/css/identity/identity-test.css"
          th:href="@{/css/identity/identity-test.css}">

    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

    <script defer
            src="/js/identity/identity-test.js"
            th:src="@{/js/identity/identity-test.js}">
    </script>
</head>

<body class="app-shell-page">

<header
        th:replace="~{fragments/app-shell :: appHeader('contract')}">
</header>

<main class="page">
    <div class="stepper-card">
        <ol class="stepper">
            <li class="stepper__step is-done">
                <span class="stepper__circle">
                    <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
                        <path d="M3 8.5 6.2 12 13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="stepper__label">차용증 작성</span>
            </li>
            <li class="stepper__step is-active">
                <span class="stepper__circle">2</span>
                <span class="stepper__label">본인인증 · 서명날인</span>
            </li>
            <li class="stepper__step">
                <span class="stepper__circle">3</span>
                <span class="stepper__label">상대확인</span>
            </li>
            <li class="stepper__step">
                <span class="stepper__circle">4</span>
                <span class="stepper__label">저장</span>
            </li>
        </ol>
    </div>

    <section class="identity-card">

        <header class="identity-header">
            <span class="identity-badge">
                PortOne Test
            </span>

            <h1>본인인증 테스트</h1>

            <p>
                본인인증 목적을 선택한 후 인증을 진행해 주세요.
            </p>
        </header>

        <div class="identity-form">
            <label for="purpose">
                본인인증 목적
            </label>

            <select id="purpose">
                <option value="LOAN_CONTRACT">
                    금전소비대차 계약
                </option>

                <option value="SETTLEMENT">
                    정산
                </option>
            </select>

            <button id="verification-button"
                    type="button">
                본인인증 시작
            </button>
        </div>

        <div class="identity-result">
            <strong>처리 결과</strong>
            <pre id="result">대기 중</pre>
        </div>

    </section>

</main>
<footer
        th:replace="~{fragments/app-shell :: appFooter}">
</footer>
<th:block
        th:replace="~{fragments/app-shell :: commonScripts}">
</th:block>
</body>
</html>
