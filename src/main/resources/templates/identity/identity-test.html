<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>본인인증 테스트</title>

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <link rel="stylesheet"
          href="/css/identity/identity-test.css"
          th:href="@{/css/identity/identity-test.css}">

    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

    <script defer
            src="/js/identity/identity-test.js"
            th:src="@{/js/identity/identity-test.js}">
    </script>
</head>

<body>

<header class="topnav">
    <div class="topnav__inner">
        <div class="topnav__logo">사이월렛</div>

        <nav class="topnav__menu">
            <a class="topnav__link" href="#">서비스 소개</a>
            <a class="topnav__link is-active" href="#">금전소비대차</a>
            <a class="topnav__link" href="#">정산관리</a>
            <a class="topnav__link" href="#">거래 일정</a>
        </nav>

        <button class="topnav__bell" type="button" aria-label="알림">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0-6 6v3.2c0 .5-.18 1-.5 1.4L4 15.5c-.6.7-.1 1.8.8 1.8h14.4c.9 0 1.4-1.1.8-1.8l-1.5-1.9a2.2 2.2 0 0 1-.5-1.4V9a6 6 0 0 0-6-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
</header>

<main class="page">
    <div class="stepper-card">
        <ol class="stepper">
            <li class="stepper__step is-active">
                <span class="stepper__circle">1</span>
                <span class="stepper__label">본인인증</span>
            </li>
            <li class="stepper__step">
                <span class="stepper__circle">2</span>
                <span class="stepper__label">차용증 작성</span>
            </li>
            <li class="stepper__step">
                <span class="stepper__circle">3</span>
                <span class="stepper__label">상대확인</span>
            </li>
            <li class="stepper__step">
                <span class="stepper__circle">4</span>
                <span class="stepper__label">서명날인</span>
            </li>
            <li class="stepper__step">
                <span class="stepper__circle">5</span>
                <span class="stepper__label">저장</span>
            </li>
        </ol>
    </div>

    <section class="identity-card">

        <header class="identity-header">
            <span class="identity-badge">
                PortOne Test
            </span>

            <h1>본인인증 테스트</h1>

            <p>
                본인인증 목적을 선택한 후 인증을 진행해 주세요.
            </p>
        </header>

        <div class="identity-form">
            <label for="purpose">
                본인인증 목적
            </label>

            <select id="purpose">
                <option value="LOAN_CONTRACT">
                    금전소비대차 계약
                </option>

                <option value="SETTLEMENT">
                    정산
                </option>
            </select>

            <button id="verification-button"
                    type="button">
                본인인증 시작
            </button>
        </div>

        <div class="identity-result">
            <strong>처리 결과</strong>
            <pre id="result">대기 중</pre>
        </div>

    </section>

</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div>
            <strong>사이월렛</strong>
            <p>서울특별시 강남구 테헤란로 000, 0층 &nbsp;|&nbsp; 사업자등록번호 000-00-00000</p>
        </div>

        <nav>
            <a href="#">이용약관</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">고객센터</a>
        </nav>
    </div>
</footer>

</body>
</html>
