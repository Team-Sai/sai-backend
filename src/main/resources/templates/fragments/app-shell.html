<!DOCTYPE html>
<html
        lang="ko"
        xmlns:th="http://www.thymeleaf.org">

<body>


<!-- ① 공통 CSS -->
<th:block th:fragment="commonStyles">

    <link
            rel="stylesheet"
            th:href="@{/css/common/app-shell.css}">

</th:block>



<!-- ② 공통 Header -->
<header
        th:fragment="appHeader(activeMenu)"
        class="app-header">

    <a
            class="app-brand"
            th:href="@{/integration/dashboard}"
            aria-label="사이원장 홈">

        <img class="app-brand__logo" th:src="@{/images/common/logo.png}" alt="사이원장 로고">
        <span class="app-brand__name">사이원장</span>

    </a>


    <nav
            class="app-nav"
            aria-label="주요 메뉴">

        <a
                class="app-nav__link"
                th:classappend="${activeMenu == 'dashboard'} ? ' is-active' : ''"
                th:href="@{/integration/dashboard}">
            대시보드
        </a>

        <a
                class="app-nav__link"
                th:classappend="${activeMenu == 'settlement'} ? ' is-active' : ''"
                th:href="@{/settlements}">
            정산
        </a>

        <a
                class="app-nav__link"
                th:classappend="${activeMenu == 'contract'} ? ' is-active' : ''"
                th:href="@{/dashboard}">
            금전소비대차
        </a>

        <a
                class="app-nav__link"
                th:classappend="${activeMenu == 'calendar'} ? ' is-active' : ''"
                th:href="@{/calendar}">
            캘린더
        </a>

    </nav>


    <div
            class="app-header-actions"
            aria-label="사용자 메뉴">

        <a
                class="app-icon-button"
                th:href="@{/archive}"
                aria-label="보관함">
            <img th:src="@{/images/common/archive.svg}" alt="">
        </a>

        <a
                class="app-icon-button"
                th:href="@{/notifications}"
                aria-label="알림">
            <img th:src="@{/images/common/notification.svg}" alt="">
        </a>

        <a
                class="app-header-profile"
                th:href="@{/mypage}">
            <img th:src="@{/images/common/profile.svg}" alt="">
        </a>

    </div>

</header>

<header th:fragment="guestHeader(activeMenu)" class="app-header guest-app-header">
    <a class="app-brand" th:href="@{/intro}" aria-label="사이원장 홈">
        <img class="app-brand__logo" th:src="@{/images/common/logo.png}" alt="사이원장 로고">
        <span class="app-brand__name">사이원장</span>
    </a>
    <nav class="app-nav" aria-label="주요 메뉴">
        <a class="app-nav__link" th:classappend="${activeMenu == 'intro'} ? ' is-active' : ''" href="#intro">서비스소개</a>
        <a class="app-nav__link" th:classappend="${activeMenu == 'settlement'} ? ' is-active' : ''" href="#settlement">정산</a>
        <a class="app-nav__link" th:classappend="${activeMenu == 'iou'} ? ' is-active' : ''" href="#iou">금전소비대차</a>
        <a class="app-nav__link" th:classappend="${activeMenu == 'calendar'} ? ' is-active' : ''" href="#calendar">캘린더</a>
    </nav>
    <div class="app-header-actions" aria-label="로그인 메뉴">
        <a class="guest-header-login" th:href="@{/login}">로그인</a>
    </div>
</header>

<header th:fragment="minimalHeader" class="app-header minimal-header">
    <a class="app-brand" th:href="@{/intro}" aria-label="사이원장 홈">
        <img class="app-brand__logo" th:src="@{/images/common/logo.png}" alt="사이원장 로고">
        <span class="app-brand__name">사이원장</span>
    </a>
</header>



<!-- ③ 공통 Footer -->
<footer
        th:fragment="appFooter"
        class="app-footer">

    <div>
        <strong>사이원장</strong>

        <p>
            정산과 차용증 거래를 한 곳에서 확인하세요.
        </p>
    </div>

    <nav aria-label="푸터 메뉴">
        <a href="#">이용약관</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">고객센터</a>
    </nav>

</footer>



<!-- ④ 공통 JS -->
<th:block th:fragment="commonScripts">

    <script
            th:src="@{/js/common/auth.js}">
    </script>

</th:block>


</body>
</html>
