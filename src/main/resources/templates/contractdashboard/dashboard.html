<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계약대시보드</title>
    <th:block th:replace="~{fragments/app-shell :: commonStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/contract/riskcheck.css}">
    <link rel="stylesheet" th:href="@{/css/contractdashboard/contract-dashboard.css}">
    <link rel="stylesheet" href="/css/contractchange/site-common.css" />
</head>
<body class="app-shell-page">

<header th:replace="~{fragments/app-shell :: appHeader('contract')}"></header>

<main class="dashboard-page">



    <div class="dashboard-header">
        <div>
            <h1 class="dashboard-title">내 계약</h1>
            <div class="role-toggle">
                <button type="button" data-role="ALL" id="roleAll">전체</button>
                <button type="button" data-role="LENT" id="roleLent">빌려준 돈</button>
                <button type="button" data-role="BORROWED" id="roleBorrowed">내가 빌린 돈</button>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="btn" id="btnSyncTransactions" >거래내역 동기화</button>
            <button type="button" class="btn btn--primary" id="btnCreateContract">+ 계약 생성</button>
        </div>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-card__label">총 계약 수</div>
            <div class="summary-card__value" id="totalContractCount"></div>
        </div>
        <div class="summary-card">
            <div class="summary-card__label">빌려준 돈</div>
            <div class="summary-card__value" id="totalLentAmount"></div>
        </div>
        <div class="summary-card">
            <div class="summary-card__label">빌린 돈</div>
            <div class="summary-card__value" id="totalBorrowedAmount"></div>
        </div>

    </div>

    <div class="control-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="계약명 검색">
        <select id="sortSelect">
            <option value="">정렬</option>
            <option value="ALPHABET">가나다순</option>
            <option value="ROLE">역할순</option>
            <option value="CATEGORY">구분순</option>
            <option value="AMOUNT_DESC">거래금액 큰순</option>
            <option value="AMOUNT_ASC">거래금액 작은순</option>
            <option value="STATUS">상태순</option>
            <option value="DEADLINE">마감일순</option>
        </select>
    </div>

    <div class="contract-table-wrap">
        <table class="contract-table">
            <thead>
            <tr>
                <th>계약명</th>
                <th>역할</th>
                <th>구분</th>
                <th>거래 금액(원금/잔액)</th>
                <th>다음 상환예정액</th>
                <th>계좌</th>
                <th>다음 납부일</th>
                <th>계약상태</th>
                <th>납부상태</th>
                <th>마감일</th>
                <th>상세</th>
            </tr>
            </thead>
            <tbody id="contractTableBody">
            </tbody>
        </table>
    </div>

    <p class="disclaimer">
        * 본 화면에 표시되는 금액과 일정은 각 계약의 내용을 요약하여 참고용으로 안내하는 정보이며,
        실제 계약 조건 및 확정 금액은 개별 계약서 원문을 기준으로 합니다.
        금액은 원 단위 미만을 반올림하여 표시되며, 실제 정산 금액과 소수점 이하 차이가 있을 수 있습니다.
    </p>

    <div class="pagination" id="pagination"></div>


</main>

<div class="modal-overlay" id="relationModalOverlay" style="display: none;">
    <div class="notice" role="dialog" aria-modal="true" aria-labelledby="relationNoticeTitle">

        <header class="notice__header">
            <span class="notice__eyebrow" id="relationNoticeTitle">안내문</span>
            <button type="button" class="notice__close" id="relationCloseBtn" aria-label="닫기">
                <svg viewBox="0 0 20 20" width="14" height="14" fill="none" aria-hidden="true">
                    <path d="M4 4L16 16M16 4L4 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </header>

        <div class="notice__body">
            <div class="notice__intro">
                <h2 class="notice__question">거래 당사자와의 관계를<br />선택해 주세요</h2>
                <p class="notice__desc">관계에 따라 세법상 적용되는 이자 기준이 달라집니다.</p>
            </div>

            <div class="relation-options" role="radiogroup" aria-label="거래 당사자와의 관계" id="relationOptions">

                <button type="button" id="btnFamily" class="relation-option" data-relation="FAMILY" role="radio" aria-checked="false">
                    <span class="relation-option__icon">
                        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="24" cy="24" r="24" fill="#EEF2FF"/>
                            <path d="M16 21.5C16 19.0147 18.0147 17 20.5 17C22.9853 17 25 19.0147 25 21.5C25 23.9853 22.9853 26 20.5 26C18.0147 26 16 23.9853 16 21.5Z" fill="#4F46E5"/>
                            <path d="M23 21.5C23 19.567 24.567 18 26.5 18C28.433 18 30 19.567 30 21.5C30 23.433 28.433 25 26.5 25C24.567 25 23 23.433 23 21.5Z" fill="#818CF8"/>
                            <path d="M13 33C13 28.5817 16.3579 25 20.5 25C24.6421 25 28 28.5817 28 33H13Z" fill="#4F46E5"/>
                            <path d="M22 33C22 29.134 24.5817 26 27.5 26C30.4183 26 33 29.134 33 33H22Z" fill="#818CF8"/>
                        </svg>
                    </span>
                    <span class="relation-option__label">가족 / 친인척</span>
                </button>

                <button type="button" id="btnAcquaintance" class="relation-option" data-relation="ACQUAINTANCE" role="radio" aria-checked="false">
                    <span class="relation-option__icon">
                        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="24" cy="24" r="24" fill="#F0FDF4"/>
                            <path d="M18 19C18 16.7909 19.7909 15 22 15C24.2091 15 26 16.7909 26 19C26 21.2091 24.2091 23 22 23C19.7909 23 18 21.2091 18 19Z" fill="#16A34A"/>
                            <path d="M26 20C26 18.3431 27.3431 17 29 17C30.6569 17 32 18.3431 32 20C32 21.6569 30.6569 23 29 23C27.3431 23 26 21.6569 26 20Z" fill="#4ADE80"/>
                            <path d="M15 31C15 26.5817 18.134 23 22 23C25.866 23 29 26.5817 29 31H15Z" fill="#16A34A"/>
                            <path d="M25 31C25 27.5 27.2386 24 30 24C32.7614 24 35 27.5 35 31H25Z" fill="#4ADE80"/>
                        </svg>
                    </span>
                    <span class="relation-option__label">지인 / 기타</span>
                </button>

            </div>
        </div>

        <footer class="notice__footer">
            <button type="button" class="btn btn--primary btn--block" id="relationConfirmBtn" disabled>확인</button>
        </footer>

    </div>
</div>

<footer th:replace="~{fragments/app-shell :: appFooter}"></footer>
<th:block th:replace="~{fragments/app-shell :: commonScripts}"></th:block>
<script th:src="@{/js/contractdashboard/contract-dashboard.js}"></script>
<script th:src="@{/js/contract/riskcheck.js}"></script>

</body>
</html>
