<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계약대시보드</title>
    <th:block
            th:replace="~{fragments/app-shell :: commonStyles}">
    </th:block>
    <link rel="stylesheet" th:href="@{/css/contractdashboard/contract-dashboard.css}">
    <link rel="stylesheet" href="/css/contractchange/site-common.css" />
    <link rel="stylesheet" href="/css/matching/matching-review-modal.css">
</head>
<body class="app-shell-page">

<header
        th:replace="~{fragments/app-shell :: appHeader('contract')}">
</header>

<div class="dashboard-page">



    <div class="dashboard-header">
        <div>
            <h1 class="dashboard-title">내 계약</h1>
            <div class="role-toggle">
                <button type="button" data-role="ALL" id="roleAll">전체</button>
                <button type="button" data-role="LENT" id="roleLent">빌려준 돈</button>
                <button type="button" data-role="BORROWED" id="roleBorrowed">내가 빌린 돈</button>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="btn" id="btnSyncTransactions" >거래내역 동기화</button>
            <button type="button" class="btn btn--primary" id="btnCreateContract">+ 계약 생성</button>
        </div>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-card__label">총 계약 수</div>
            <div class="summary-card__value" id="totalContractCount"></div>
        </div>
        <div class="summary-card">
            <div class="summary-card__label">빌려준 돈</div>
            <div class="summary-card__value" id="totalLentAmount"></div>
        </div>
        <div class="summary-card">
            <div class="summary-card__label">빌린 돈</div>
            <div class="summary-card__value" id="totalBorrowedAmount"></div>
        </div>

    </div>

    <div class="control-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="계약명 검색">
        <select id="sortSelect">
            <option value="">정렬</option>
            <option value="ALPHABET">가나다순</option>
            <option value="ROLE">역할순</option>
            <option value="CATEGORY">구분순</option>
            <option value="AMOUNT_DESC">거래금액 큰순</option>
            <option value="AMOUNT_ASC">거래금액 작은순</option>
            <option value="STATUS">상태순</option>
            <option value="DEADLINE">마감일순</option>
        </select>
    </div>

    <div class="contract-table-wrap">
        <table class="contract-table">
            <thead>
            <tr>
                <th>계약명</th>
                <th>역할</th>
                <th>구분</th>
                <th>거래 금액(원금/잔액)</th>
                <th>다음 상환예정액</th>
                <th>계좌</th>
                <th>다음 납부일</th>
                <th>계약상태</th>
                <th>납부상태</th>
                <th>마감일</th>
                <th>상세</th>
            </tr>
            </thead>
            <tbody id="contractTableBody">
            </tbody>
        </table>
    </div>

    <p class="disclaimer">
        * 본 화면에 표시되는 금액과 일정은 각 계약의 내용을 요약하여 참고용으로 안내하는 정보이며,
        실제 계약 조건 및 확정 금액은 개별 계약서 원문을 기준으로 합니다.
        금액은 원 단위 미만을 반올림하여 표시되며, 실제 정산 금액과 소수점 이하 차이가 있을 수 있습니다.
    </p>

    <div class="pagination" id="pagination"></div>


</div>
<footer
        th:replace="~{fragments/app-shell :: appFooter}">
</footer>
<th:block th:replace="~{fragments/matching-review-modal :: matchingReviewModal}"></th:block>
<th:block
        th:replace="~{fragments/app-shell :: commonScripts}">
</th:block>
<script src="/js/matching/matching-review-modal.js"></script>
<script th:src="@{/js/contractdashboard/contract-dashboard.js}"></script>
</body>
</html>
