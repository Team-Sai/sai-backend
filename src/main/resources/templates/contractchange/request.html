<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계약 조건 변경 요청</title>
    <link rel="stylesheet" th:href="@{/css/contractchange/contractchange.css}">
</head>
<body>

<input type="hidden" id="contractId" th:value="${contractId}">

<div class="page">
    <h1>계약 조건 변경 요청</h1>
    <p>협의된 새로운 계약 조건들을 입력해주세요. 제출 시 상대방에게 알림이 전송됩니다.</p>

    <div class="content">
        <form id="changeRequestForm">
            <label for="changeReason">변경 사유</label>
            <textarea id="changeReason" placeholder="변경 내용을 변경하고자 하는 구체적인 사유를 입력해주세요."></textarea>

            <label for="newMaturityDate">변경 만기일</label>
            <input type="date" id="newMaturityDate">

            <label for="newInterestRate">변경 이율</label>
            <input type="number" step="0.01" id="newInterestRate">

            <label for="newRepaymentType">상환 방식</label>
            <select id="newRepaymentType">
                <option value="">선택해주세요</option>
                <option value="EQUAL_PRINCIPAL_AND_INTEREST">원리금균등상환</option>
                <option value="EQUAL_PRINCIPAL">원금균등상환</option>
                <option value="BULLET_REPAYMENT">만기일시상환</option>
            </select>

            <label for="newRepaymentDate">상환일 변경</label>
            <input type="number" id="newRepaymentDate" min="1" max="31" placeholder="예: 15">

            <button type="button" id="cancelButton">변경 취소</button>
            <button type="submit" id="submitButton">변경 요청 보내기</button>
        </form>

        <div class="current-contract">
            <h2>현재 계약조건</h2>
            <dl>
                <dt>계약 금액</dt><dd id="principalAmount">-</dd>
                <dt>현재 이율</dt><dd id="interestRate">-</dd>
                <dt>만기일</dt><dd id="maturityDate">-</dd>
                <dt>상환 방식</dt><dd id="repaymentType">-</dd>
                <dt>상환일</dt><dd id="repaymentDay">-</dd>
            </dl>
        </div>
    </div>
</div>

<script th:src="@{/js/contractchange/contractchange.js}"></script>
</body>
</html>
