<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상환현황 상세조회</title>
    <link rel="stylesheet" th:href="@{/css/contractrepaymentschedule/contractrepaymentschedule.css}">
</head>
<body>

<div class="schedule-container">

    <div class="schedule-header">
        <span class="status-badge" id="statusBadge"></span>
        <span class="contract-alias" id="contractAlias"></span>
    </div>

    <div class="schedule-card">
        <dl class="summary-grid">
            <div class="summary-item">
                <dt>총 상환예정액</dt>
                <dd id="totalScheduledAmount"></dd>
            </div>
            <div class="summary-item">
                <dt>누적 납부액</dt>
                <dd id="paidAmount"></dd>
            </div>
            <div class="summary-item remaining">
                <dt>잔여 상환액</dt>
                <dd id="remainingAmount"></dd>
            </div>
            <div class="summary-item">
                <dt>진행률</dt>
                <dd id="progressLabel"></dd>
            </div>
        </dl>

        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <button type="button" class="btn-view-contract" id="btnViewContract">계약서 보기</button>
    </div>

    <div class="schedule-card">
        <dl class="contract-info-grid">
            <dt>생성일</dt><dd id="createdAt"></dd>
            <dt>이율</dt><dd id="interestRate"></dd>
            <dt>만기일</dt><dd id="maturityDate"></dd>
            <dt>상환방식</dt><dd id="repaymentType"></dd>
        </dl>
    </div>

    <div class="schedule-card">
        <div class="account-placeholder">
            <span>계좌 연동 준비 중</span>
            <button type="button" class="btn-sync-transaction" disabled>거래동기화</button>
        </div>
    </div>

    <div class="schedule-card">
        <table class="schedule-table">
            <thead>
            <tr>
                <th>회차</th>
                <th>상환일</th>
                <th>상환금액</th>
                <th>입금일</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody id="scheduleTableBody">
            </tbody>
        </table>
    </div>

    <input type="hidden" id="contractId" th:value="${contractId}">

</div>

<script th:src="@{/js/contractrepaymentschedule/contractrepaymentschedule.js}"></script>
</body>
</html>
