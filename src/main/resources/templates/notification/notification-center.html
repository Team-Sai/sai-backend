<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알림센터 | 사이원장</title>

  <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
      rel="stylesheet"
  />

  <link
      rel="stylesheet"
      th:href="@{/css/notification/notification-center.css}"
      href="./notification-center.css"
  />
</head>

<body>

<header class="topnav">
  <div class="topnav__inner">

    <a class="topnav__logo" href="/">사이원장</a>

    <nav class="topnav__menu">
      <a class="topnav__link" href="/">서비스 소개</a>
      <a class="topnav__link" href="/contracts">금전소비대차</a>
      <a class="topnav__link" href="/settlements">정산관리</a>
      <a class="topnav__link" href="/schedule">거래 일정</a>
    </nav>

    <a
        class="topnav__bell"
        href="/notifications"
        aria-label="알림"
    >
      <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          aria-hidden="true"
      >
        <path
            d="M12 3a6 6 0 0 0-6 6v3.2c0 .5-.18 1-.5 1.4L4 15.5c-.6.7-.1 1.8.8 1.8h14.4c.9 0 1.4-1.1.8-1.8l-1.5-1.9a2.2 2.2 0 0 1-.5-1.4V9a6 6 0 0 0-6-6Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
        />
        <path
            d="M9.5 19a2.5 2.5 0 0 0 5 0"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
        />
      </svg>
    </a>

  </div>
</header>


<main class="page">

  <div class="page-head">
    <h1 class="page-title">알림센터</h1>
    <p class="page-subtitle">
      계약과 정산 등 최근 발생한 중요 소식을 한눈에 확인하세요.
    </p>
  </div>


  <div class="toolbar">

    <div class="filter-tabs">
      <button
          type="button"
          class="filter-tab active"
          data-category="ALL"
      >
        전체
      </button>

      <button
          type="button"
          class="filter-tab"
          data-category="SIGN"
      >
        서명·계약
      </button>

      <button
          type="button"
          class="filter-tab"
          data-category="SETTLEMENT"
      >
        정산
      </button>

      <button
          type="button"
          class="filter-tab"
          data-category="PAYMENT"
      >
        상환·거래
      </button>

      <button
          type="button"
          class="filter-tab"
          data-category="SYSTEM"
      >
        시스템
      </button>
    </div>

  </div>


  <ul
      id="notifList"
      class="notif-list"
      aria-live="polite"
  ></ul>

</main>


<footer class="site-footer">
  <div class="footer-inner">

    <div>
      <strong>사이원장</strong>
      <p>© Sai-Wonjang. All rights reserved.</p>
    </div>

    <nav>
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a>
    </nav>

  </div>
</footer>


<script
    th:src="@{/js/notification/notification-center.js}"
    src="./notification-center.js"
></script>

</body>
</html>
