<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알림센터 | 사이원장</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/notification/notification-center.css}" href="./notification-center.css" />
</head>
<body>

<header class="topnav">
  <div class="topnav__inner">
    <div class="topnav__logo">사이월렛</div>

    <nav class="topnav__menu">
      <a class="topnav__link" href="#">서비스 소개</a>
      <a class="topnav__link is-active" href="#">금전소비대차</a>
      <a class="topnav__link" href="#">정산관리</a>
      <a class="topnav__link" href="#">거래 일정</a>
    </nav>

    <button class="topnav__bell" type="button" aria-label="알림">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0-6 6v3.2c0 .5-.18 1-.5 1.4L4 15.5c-.6.7-.1 1.8.8 1.8h14.4c.9 0 1.4-1.1.8-1.8l-1.5-1.9a2.2 2.2 0 0 1-.5-1.4V9a6 6 0 0 0-6-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h1 class="page-title">알림센터</h1>
    <p class="page-subtitle">최근 발생한 중요 소식들을 한눈에 확인하세요.</p>
  </div>


  <div class="toolbar">
    <div class="filter-tabs">
      <button class="filter-tab active" data-category="ALL">전체</button>
      <button class="filter-tab" data-category="SIGN">서명·계약</button>
      <button class="filter-tab" data-category="PAYMENT">상환·거래</button>
      <button class="filter-tab" data-category="SYSTEM">시스템</button>
    </div>

    <div class="settings-menu-wrapper">
      <button id="btnSettings" class="settings-btn" aria-label="알림 설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V19.5a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H4.5a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H10a1.65 1.65 0 001-1.51V4.5a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V10a1.65 1.65 0 001.51 1h.09a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>

      <div id="settingsDropdown" class="dropdown-menu hidden">
        <button class="dropdown-item">알림 설정</button>
        <button id="btnEnterDeleteMode" class="dropdown-item text-danger">알림 삭제</button>
      </div>
    </div>
  </div>


  <ul id="notifList" class="notif-list"></ul>


  <div id="normalFooter">
    <button class="load-more">이전 알림 보기</button>
  </div>


  <div id="deleteFooter" class="delete-footer hidden">
    <button id="btnSelectAll" class="btn-select-all">전체 선택</button>
    <button id="btnDeleteSelected" class="btn-delete-submit">삭제 (<span id="selectedCount">0</span>)</button>
  </div>
</main>

<script th:src="@{/js/notification/notification-center.js}" src="./notification-center.js"></script>
</body>
</html>
