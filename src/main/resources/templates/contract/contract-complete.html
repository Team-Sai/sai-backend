<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금전소비대차계약 체결 완료</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" th:href="@{/css/contract/contract-form.css}" href="../../static/css/contract/contract-form.css" />
    <link rel="stylesheet" th:href="@{/css/contract/contract-complete.css}" href="../../static/css/contract/contract-complete.css" />
</head>
<body>

<header class="topnav">
  <div class="topnav__inner">
    <div class="topnav__logo">사이원장</div>

    <nav class="topnav__menu">
      <a class="topnav__link" href="#">서비스 소개</a>
      <a class="topnav__link is-active" href="#">금전소비대차</a>
      <a class="topnav__link" href="#">정산관리</a>
      <a class="topnav__link" href="#">거래 일정</a>
    </nav>

    <a class="topnav__bell" href="/notifications" aria-label="알림">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0-6 6v3.2c0 .5-.18 1-.5 1.4L4 15.5c-.6.7-.1 1.8.8 1.8h14.4c.9 0 1.4-1.1.8-1.8l-1.5-1.9a2.2 2.2 0 0 1-.5-1.4V9a6 6 0 0 0-6-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="topnav__bell-badge" id="topnavBellBadge" hidden></span>
    </a>
  </div>
</header>

<main class="page">
  <div class="stepper-card">
    <ol class="stepper">
      <li class="stepper__step is-done">
        <span class="stepper__circle">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
            <path d="M3 8.5 6.2 12 13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="stepper__label">차용증 작성</span>
      </li>
      <li class="stepper__step is-done">
        <span class="stepper__circle">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
            <path d="M3 8.5 6.2 12 13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="stepper__label">본인인증 · 서명날인</span>
      </li>
      <li class="stepper__step is-done">
        <span class="stepper__circle">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
            <path d="M3 8.5 6.2 12 13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="stepper__label">상대확인</span>
      </li>
      <li class="stepper__step is-done">
        <span class="stepper__circle">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
            <path d="M3 8.5 6.2 12 13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="stepper__label">저장</span>
      </li>
    </ol>
  </div>

  <div class="success-container">
    <header class="success-header">
        <h1 class="success-title">금전소비대차계약이 성공적으로 체결되었습니다!</h1>
        <div class="success-icon" aria-hidden="true">🎉</div>
        <p class="success-description">
            "전자서명이 완료된 원본 차용증은 언제든지 조회 및 발급이 가능합니다."
        </p>
    </header>

    <section class="contract-card">
        <h2 class="contract-card__title">금 전 소 비 대 차 계 약 서</h2>

        <div class="contract-card__decorations" aria-hidden="true">
            <span class="decor-line"></span>
            <span class="decor-line"></span>
            <span class="decor-line"></span>
            <span class="decor-line"></span>
            <span class="decor-line"></span>
        </div>

        <div class="stamp-seal" aria-label="체결완료">
            <span class="stamp-seal__text">체결완료</span>
        </div>

        <div class="contract-card__badge-group">
                <span class="badge badge--digital">
                    <svg class="badge__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    디지털 원본
                </span>
        </div>
    </section>

    <footer class="action-group">
        <button type="button" id="btnViewContract" class="btn btn--primary">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>차용증 확인</span>
        </button>
        <button type="button" class="btn btn--secondary">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="9"></rect>
                <rect x="14" y="3" width="7" height="5"></rect>
                <rect x="14" y="12" width="7" height="9"></rect>
                <rect x="3" y="16" width="7" height="5"></rect>
            </svg>
            <span>대시보드로 이동</span>
        </button>
    </footer>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <strong>사이원장</strong>
      <p>© Sai-Wonjang. All rights reserved.</p>
    </div>
    <nav>
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a>
    </nav>
  </div>
</footer>

<script th:src="@{/js/notification/topnav-notifications.js}" src="../../static/js/notification/topnav-notifications.js"></script>
<script th:src="@{/js/contract/contract-complete.js}" src="../../static/js/contract/contract-complete.js"></script>
</body>
</html>
