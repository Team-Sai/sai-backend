<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금전소비대차계약 수정 완료</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" th:href="@{/css/contract/contract-edit-complete.css}" href="../../static/css/contract/contract-edit-complete.css" />
</head>
<body>

<main class="success-container">
    <header class="success-header">
        <h1 class="success-title">금전소비대차계약이 수정되었습니다.</h1>
        <div class="success-icon" aria-hidden="true">🎉</div>
        <p class="success-description">
            "아래의 차용증 확인에서 차용증 확인이 가능합니다."
        </p>
    </header>

    <section class="contract-card">
        <h2 class="contract-card__title">금 전 소 비 대 차 계 약 서</h2>

        <div class="contract-card__decorations" aria-hidden="true">
            <span class="decor-line"></span>
            <span class="decor-line"></span>
            <span class="decor-line"></span>
            <span class="decor-line"></span>
            <span class="decor-line"></span>
        </div>

        <div class="stamp-seal" aria-label="수정완료">
            <span class="stamp-seal__text">수정완료</span>
        </div>

        <div class="contract-card__badge-group">
                <span class="badge badge--digital">
                    <svg class="badge__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    디지털 원본
                </span>
        </div>
    </section>

    <footer class="action-group">
        <button type="button" id="btnViewContract" class="btn btn--primary">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>차용증 확인</span>
        </button>
        <button type="button" class="btn btn--secondary">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="9"></rect>
                <rect x="14" y="3" width="7" height="5"></rect>
                <rect x="14" y="12" width="7" height="9"></rect>
                <rect x="3" y="16" width="7" height="5"></rect>
            </svg>
            <span>대시보드로 이동</span>
        </button>
    </footer>
</main>

<script th:src="@{/js/contract/contract-edit-complete.js}" src="../../static/js/contract/contract-edit-complete.js"></script>
</body>
</html>
