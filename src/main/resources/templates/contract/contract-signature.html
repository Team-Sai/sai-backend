<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금전차용계약서 서명 | 사이원장</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/contract/contract-form.css}" href="../../static/css/contract/contract-form.css" />
  <link rel="stylesheet" th:href="@{/css/contract/contract-debtor-approve.css}" href="../../static/css/contract/contract-debtor-approve.css" />
</head>
<body>

<header class="topnav">
  <div class="topnav__inner">
    <div class="topnav__logo">사이원장</div>

    <nav class="topnav__menu">
      <a class="topnav__link" href="#">서비스 소개</a>
      <a class="topnav__link is-active" href="#">금전소비대차</a>
      <a class="topnav__link" href="#">정산관리</a>
      <a class="topnav__link" href="#">거래 일정</a>
    </nav>

    <a class="topnav__bell" href="/notifications" aria-label="알림">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0-6 6v3.2c0 .5-.18 1-.5 1.4L4 15.5c-.6.7-.1 1.8.8 1.8h14.4c.9 0 1.4-1.1.8-1.8l-1.5-1.9a2.2 2.2 0 0 1-.5-1.4V9a6 6 0 0 0-6-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="topnav__bell-badge" id="topnavBellBadge" hidden></span>
    </a>
  </div>
</header>

<main class="page">

  <div class="stepper-card">
    <ol class="stepper">
      <li class="stepper__step is-done">
        <span class="stepper__circle">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
            <path d="M3 8.5 6.2 12 13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="stepper__label">차용증 작성</span>
      </li>
      <li class="stepper__step is-active">
        <span class="stepper__circle">2</span>
        <span class="stepper__label">본인인증 · 서명날인</span>
      </li>
      <li class="stepper__step">
        <span class="stepper__circle">3</span>
        <span class="stepper__label">상대확인</span>
      </li>
      <li class="stepper__step">
        <span class="stepper__circle">4</span>
        <span class="stepper__label">저장</span>
      </li>
    </ol>
  </div>

  <div class="doc" id="signatureCard">

    <h1 class="doc__title">금 전 차 용 계 약 서</h1>

    <div id="contractFields">

    <section class="doc__article">
      <span class="doc__clause">상대방 지정</span>
      <div class="doc__body">
        <span class="doc__text">
          차용증을 전달받을 채무자의 회원 토큰을 입력하세요.
        </span>
        <input
                type="text"
                id="debtorUserToken"
                name="debtorUserToken"
                class="doc__inline-input doc__inline-input--alias"
                placeholder="예: SAI_ABCD1234"
                required
        />
      </div>
    </section>

    <section class="sign">
      <h2 class="sign__title">서명 (Signature)</h2>
      <p class="doc__hint">서명 패드에 수기 서명을 남겨주세요.</p>
      <div class="sign__pad-wrap">
        <div class="sign__placeholder" id="signPlaceholder">SIGN HERE</div>
        <canvas id="signatureCanvas" class="sign__canvas" width="590" height="220"></canvas>
        <button type="button" class="sign__clear" id="clearSignature">지우기</button>
      </div>
    </section>

    <div class="agreement">
      <input type="checkbox" class="agreement__checkbox" id="agreeCheckbox" />
      <label class="agreement__label" for="agreeCheckbox">
        위 약정 내용을 모두 확인하였으며, 전자 서명을 통한 최종 합의 의사를 기록합니다.
      </label>
    </div>

    <div class="doc__actions">
      <button type="button" class="btn btn--ghost" id="btnCancel">취소</button>
      <button type="button" class="btn btn--primary" id="btnSubmit">전송</button>
    </div>

    </div>

    <p class="doc__status" id="formStatus" role="status" aria-live="polite"></p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <strong>사이원장</strong>
      <p>© Sai-Wonjang. All rights reserved.</p>
    </div>
    <nav>
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a>
    </nav>
  </div>
</footer>

<script th:src="@{/js/notification/topnav-notifications.js}" src="../../static/js/notification/topnav-notifications.js"></script>
<script th:src="@{/js/contract/contract-signature.js}" src="../../static/js/contract/contract-signature.js"></script>
</body>
</html>
