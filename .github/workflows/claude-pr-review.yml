name: Claude PR Review

on:
  # dev PR 최초 생성 또는 Draft 해제 시 자동 리뷰
  pull_request:
    branches:
      - dev
    types:
      - opened
      - ready_for_review

  # PR 댓글에 @claude review 작성 시 수동 재리뷰
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  review:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      )
      ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        startsWith(github.event.comment.body, '@claude review') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: PR 코드 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'issue_comment'
                && format('refs/pull/{0}/head', github.event.issue.number)
                || github.event.pull_request.head.sha }}

      - name: Claude 코드 리뷰
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          include_fix_links: false
          show_full_output: false
          track_progress: true

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            현재 Pull Request의 최신 변경사항을 코드 리뷰하세요.

            저장소 루트에 CLAUDE.md가 있다면 먼저 읽고,
            해당 프로젝트의 규칙을 리뷰 기준으로 사용하세요.

            다음 항목을 우선 검토하세요.

            1. 실제 실행 오류 또는 예외 발생 가능성
            2. 잘못된 비즈니스 로직
            3. Null 처리와 경계값 누락
            4. 트랜잭션과 데이터 정합성
            5. 인증·인가 및 민감정보 노출
            6. 중복 요청과 멱등성 문제
            7. 예외 처리와 HTTP 상태 코드
            8. 핵심 기능 테스트 누락

            리뷰 규칙:

            - 모든 코멘트는 한국어로 작성하세요.
            - 이번 PR에서 변경된 코드만 검토하세요.
            - 기존 코드에 이미 있던 문제는 지적하지 마세요.
            - 단순 포맷, 취향, 사소한 네이밍은 지적하지 마세요.
            - 실제 수정 가치가 있는 문제만 게시하세요.
            - 같은 원인에서 발생한 문제는 하나로 묶으세요.
            - 인라인 코멘트는 중요한 문제부터 최대 10개까지만 게시하세요.
            - 문제 발생 상황과 수정 방향을 함께 설명하세요.
            - 특정 줄의 문제는 해당 줄에 인라인 코멘트로 게시하세요.
            - 인라인 코멘트 도구 사용 시 confirmed: true를 지정하세요.
            - 전체적인 내용은 gh pr comment로 게시하세요.
            - 분석 결과를 Actions 로그에만 출력하고 종료하지 마세요.
            - 인라인 문제 유무와 관계없이 마지막에 반드시 PR 요약 댓글을 게시하세요.
            - 문제가 없다면 "중대한 문제를 발견하지 못했습니다."라고 게시하세요.
            - GitHub 댓글 게시가 완료되기 전에는 작업을 종료하지 마세요.

            심각도:

            - [BLOCKER]&#58; 보안 사고, 실행 불가, 데이터 손실
            - [HIGH]&#58; 핵심 로직 오류 또는 잘못된 결과
            - [MEDIUM]&#58; 안정성이나 유지보수에 실질적인 영향
            - [LOW]&#58; 수정 가치가 명확한 작은 개선

          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
